services:
  - type: web
    name: kinepool
    env: docker
    plan: free
    region: oregon
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kinepool-db
          property: connectionString
      - key: RVE_SIGNING_KEY
        generateValue: true
      - key: ENABLE_DOCS
        value: "1"
        
databases:
  - name: kinepool-db
    plan: free
    databaseName: kinepool
    user: kinepool_user