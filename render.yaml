services:
  - type: web
    name: kinepool-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kinepool-db
          property: connectionString

databases:
  - name: kinepool-db
    plan: starter
    databaseName: kinepool
    user: kinepool_user